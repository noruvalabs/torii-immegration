scope:
  jurisdiction: JP
  visa_category: work
  action: renewal
  is_live: true
  name: Japan 技人国 work visa — extension of period of stay (在留期間更新許可申請)
stages:
- sequence: 1
  code: applicant_filing
  actor: applicant
intake:
  questions:
  - key: full_name
    section: Personal & Identity
    prompt: What is your full name as it appears on your passport?
    type: string
    min_length: 2
    max_length: 200
    required: true
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Notice on Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: nationality
    section: Personal & Identity
    prompt: What is your nationality (passport country)?
    type: enum
    options:
    - JP
    - US
    - GB
    - CA
    - AU
    - DE
    - FR
    - SG
    - KR
    - AE
    - NZ
    - NL
    - IT
    - ES
    - CH
    - IE
    - TH
    - MY
    - IN
    - CN
    - BD
    - PH
    - VN
    - ID
    - other
    required: true
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Statutory Passport & Identity Verification Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: passport_number
    section: Personal & Identity
    prompt: What is your passport number?
    type: string
    min_length: 5
    max_length: 32
    required: true
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Statutory Passport & Identity Verification Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: passport_expiry
    section: Personal & Identity
    prompt: What is your passport expiration date (YYYY-MM-DD)?
    type: date
    required: true
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Statutory Passport & Identity Verification Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: residence_card_number
    section: Residence Card & Status
    prompt: What is your 12-character Residence Card number (在留カード番号)?
    type: string
    min_length: 12
    max_length: 12
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Residence Card Registry & Continuity Verification (在留カード)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: residence_card_expiry
    section: Residence Card & Status
    prompt: What is the current expiration date on your Residence Card (YYYY-MM-DD)?
    type: date
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Residence Card Registry & Continuity Verification (在留カード)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: registered_address_japan
    section: Residence Card & Status
    prompt: What is your registered residential address in Japan?
    type: string
    min_length: 5
    max_length: 300
    required: true
    citation:
      authority: Immigration Services Agency of Japan (出入国在留管理庁)
      title: Official Notice on Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: years_in_japan
    section: Residence Card & Status
    prompt: How many full years have you lived in Japan under valid residence status?
    type: integer
    min_value: 0
    max_value: 80
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Residence Card Registry & Continuity Verification (在留カード)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: has_sponsor
    section: Employer & Income
    prompt: Do you have an employer or institutional sponsor for this renewal?
    type: boolean
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Sponsoring Organization & Professional Activity Guidelines (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: sponsor_name
    section: Employer & Income
    prompt: What is your sponsor's legal name in Japan?
    type: string
    min_length: 2
    max_length: 200
    show_when:
      key: has_sponsor
      equals: true
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Statutory Passport & Identity Verification Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: employment_status
    section: Employer & Income
    prompt: What is your current employment status?
    type: enum
    options:
    - employed
    - self_employed
    - unemployed
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Sponsoring Organization & Professional Activity Guidelines (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: employer_name
    section: Employer & Income
    prompt: What is your current employer's legal company name?
    type: string
    min_length: 2
    max_length: 200
    show_when:
      key: employment_status
      equals: employed
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Statutory Passport & Identity Verification Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: employer_corporate_number
    section: Employer & Income
    prompt: What is your employer's 13-digit Corporate Number (法人番号)?
    type: string
    min_length: 13
    max_length: 13
    show_when:
      key: employment_status
      equals: employed
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Sponsoring Organization & Professional Activity Guidelines (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: employer_category
    section: Employer & Income
    prompt: Which category does your employer fall into? Category 1-2 are listed /
      large / high-withholding employers; Category 3-4 are smaller companies and startups.
    type: enum
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: 技術・人文知識・国際業務 clarification guidance
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: annual_salary_jpy
    section: Employer & Income
    prompt: What is your annual gross income/salary in JPY (in Yen)?
    type: integer
    min_value: 0
    max_value: 100000000
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Sponsoring Organization & Professional Activity Guidelines (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: same_employer_as_last_application
    section: Continuity
    prompt: Is your employer the same as in your last application for this status?
    type: boolean
    required: true
    citation:
      authority: Immigration Services Agency of Japan (ISA)
      title: Sponsoring Organization & Professional Activity Guidelines (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: same_duties_as_last_application
    section: Continuity
    prompt: Are you performing substantially the same duties as in your last application?
      (This affects whether Japanese-language documentation is required.)
    type: boolean
    required: true
    show_when:
      key: same_employer_as_last_application
      equals: true
    citation:
      authority: Immigration Services Agency of Japan
      title: 技術・人文知識・国際業務 clarification guidance (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: employer_sanctioned
    section: Employer & Income
    prompt: Has your employer (the whole legal entity) been sanctioned under the Specified
      Skilled Worker or Technical Intern regimes? This is not a question about you
      — sanctions block the entity for 技人国 applications.
    type: boolean
    required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Linked sanctions guidance for 技術・人文知識・国際業務
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: resident_tax_status
    section: Tax & Pension Compliance
    prompt: Is your Resident Tax (住民税) fully paid to date with no outstanding arrears?
    type: boolean
    required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Review Standards for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: pension_health_insurance
    section: Tax & Pension Compliance
    prompt: Are your Employees' Pension / National Pension and Health Insurance fully
      paid?
    type: boolean
    required: true
    citation:
      authority: Immigration Services Agency of Japan & National Tax Agency
      title: Resident Tax (住民税) & Income Tax Compliance Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: departures_past_year
    section: Travel & Disclosures
    prompt: How many days in total have you spent outside Japan in the past 12 months?
    type: integer
    min_value: 0
    max_value: 365
    required: true
    citation:
      authority: Immigration Control and Refugee Recognition Act Article 5
      title: Statutory Suitability & Good Conduct Review Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  - key: criminal_disclosures
    section: Travel & Disclosures
    prompt: Have you ever been convicted of any crime or fined for traffic violations
      in Japan or abroad?
    type: boolean
    required: true
    citation:
      authority: Immigration Control and Refugee Recognition Act Article 5
      title: Statutory Suitability & Good Conduct Review Standards
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
eligibility:
  rules:
  - key: years_in_japan
    operator: min
    value: 1
    failure_status: fail
    message: At least one full year of valid residence in Japan is required for this
      renewal path.
    citation:
      authority: Immigration Services Agency of Japan
      title: Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - key: resident_tax_status
    operator: equals
    value: true
    failure_status: warning
    message: Tax arrears or unpaid Resident Tax (住民税) can lead to visa rejection or
      reduced period of stay.
    citation:
      authority: Immigration Services Agency of Japan
      title: Guidelines for Permission for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - key: pension_health_insurance
    operator: equals
    value: true
    failure_status: warning
    message: Lapsed pension or social insurance contributions are among the most common
      quiet refusal causes for extension.
    citation:
      authority: Immigration Services Agency of Japan
      title: Review Standards for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - key: employer_sanctioned
    operator: equals
    value: false
    failure_status: fail
    message: A sanctioned employer (under Specified Skilled Worker or Technical Intern
      regimes) blocks 技人国 applications for the whole legal entity. This requires human
      review.
    citation:
      authority: Immigration Services Agency of Japan
      title: Linked sanctions guidance for 技術・人文知識・国際業務
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - key: same_duties_as_last_application
    operator: equals
    value: true
    failure_status: warning
    message: With a Category 3-4 employer, additional documentation of Japanese ability
      is required for an extension unless you have continued in substantially the
      same duties since the previous application.
    employer_category:
    - '3'
    - '4'
    effective_from: '2026-04-15'
    citation:
      authority: Immigration Services Agency of Japan
      title: 技術・人文知識・国際業務 clarification guidance
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - key: criminal_disclosures
    operator: equals
    value: false
    failure_status: review
    message: Prior convictions or major violations require human attorney legal review
      for discretionary assessment.
    citation:
      authority: Immigration Services Agency of Japan
      title: Immigration Control and Refugee Recognition Act Art. 24
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
documents:
  items:
  - code: passport
    name:
      en: Passport (Valid Original)
      ja: パスポート（原本）
    how_to_obtain:
      en: Use your current valid original passport.
      ja: 有効なパスポート原本。
    why_required:
      en: Confirms identity, nationality, and valid travel document status.
    is_required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: residence_card
    name:
      en: Residence card (原本)
      ja: 在留カード（原本）
    how_to_obtain:
      en: Present the original residence card currently issued to you.
    why_required:
      en: Confirms current registered residence status and legal period of stay.
    is_required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: employment_contract
    name:
      en: Employment contract or Appointment Letter
      ja: 雇用契約書または就任承諾書
    how_to_obtain:
      en: Request a current executed copy from your employer HR department.
    why_required:
      en: Proves ongoing employment, salary level, and job position compliance.
    is_required: true
    show_when:
      key: employment_status
      equals: employed
    citation:
      authority: Immigration Services Agency of Japan
      title: Application for Extension of Period of Stay
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: tax_certificate
    name:
      en: Resident Tax Certificate (課税証明書・納税証明書)
      ja: 住民税の課税証明書及び納税証明書
    how_to_obtain:
      en: Issued by your local Ward Office / City Hall (役所) for the most recent year.
    why_required:
      en: Verifies compliance with Japanese tax obligations and annual income.
    is_required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Required Documents for Period of Stay Extension
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: withholding_tax_slip
    name:
      en: Annual Withholding Tax Slip (源泉徴収票)
      ja: 源泉徴収票
    how_to_obtain:
      en: Issued by your employer at year-end or upon request from payroll.
    why_required:
      en: Confirms annual gross salary paid by Japanese employer.
    is_required: true
    show_when:
      key: employment_status
      equals: employed
    citation:
      authority: Immigration Services Agency of Japan
      title: Required Documents for Period of Stay Extension
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: employer_certificate_of_registration
    name:
      en: Employer Certificate of Registration / Current Registration
      ja: 現在事項全部証明書（法人登記簿）
    how_to_obtain:
      en: Request a current registration extract from the employer or Legal Affairs
        Bureau.
    why_required:
      en: Verifies the employer entity for smaller / non-listed companies (Category
        3-4).
    is_required: true
    show_when:
      key: employer_category
      equals: '3'
    citation:
      authority: Immigration Services Agency of Japan
      title: Required Documents for Period of Stay Extension
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: employer_certificate_of_registration_cat4
    name:
      en: Employer Certificate of Registration / Current Registration (Category 4)
      ja: 現在事項全部証明書（法人登記簿）
    how_to_obtain:
      en: Request a current registration extract from the employer or Legal Affairs
        Bureau.
    why_required:
      en: Verifies the employer entity for Category 4 employers.
    is_required: true
    show_when:
      key: employer_category
      equals: '4'
    citation:
      authority: Immigration Services Agency of Japan
      title: Required Documents for Period of Stay Extension
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: japanese_ability_documentation
    name:
      en: Japanese-language ability documentation
      ja: 日本語能力を証明する書類
    how_to_obtain:
      en: Provide a certificate or other documentation of Japanese ability relevant
        to your customer-facing duties (JLPT, educational transcript, etc.).
    why_required:
      en: Required since 15 Apr 2026 for Category 3-4 employers unless duties are
        substantially unchanged.
    is_required: true
    show_when:
      key: employer_category
      equals: '3'
    effective_from: '2026-04-15'
    citation:
      authority: Immigration Services Agency of Japan
      title: 技術・人文知識・国際業務 clarification guidance (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
  - code: japanese_ability_documentation_cat4
    name:
      en: Japanese-language ability documentation (Category 4)
      ja: 日本語能力を証明する書類
    how_to_obtain:
      en: Provide a certificate or other documentation of Japanese ability relevant
        to your customer-facing duties (JLPT, educational transcript, etc.).
    why_required:
      en: Required since 15 Apr 2026 for Category 4 employers unless duties are substantially
        unchanged.
    is_required: true
    show_when:
      key: employer_category
      equals: '4'
    effective_from: '2026-04-15'
    citation:
      authority: Immigration Services Agency of Japan
      title: 技術・人文知識・国際業務 clarification guidance (別紙4)
      url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
      source_version: 2026-04
forms:
- code: extension_of_stay
  version: 2026-04
  official_title: Application for Extension of Period of Stay — Applicant Part (在留期間更新許可申請書
    申請人等作成用 P1-P2)
  citation:
    authority: Immigration Services Agency of Japan
    title: Application for Extension of Period of Stay
    url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
    source_version: 2026-04
  field_mappings:
  - form_field: applicant.full_name
    answer_key: full_name
    required: true
  - form_field: applicant.nationality
    answer_key: nationality
    required: true
  - form_field: applicant.passport_number
    answer_key: passport_number
    required: true
  - form_field: applicant.passport_expiry
    answer_key: passport_expiry
    required: true
  - form_field: residence.card_number
    answer_key: residence_card_number
    required: true
  - form_field: residence.card_expiry
    answer_key: residence_card_expiry
    required: true
  - form_field: residence.address
    answer_key: registered_address_japan
    required: true
  - form_field: residence.years_in_japan
    answer_key: years_in_japan
    required: true
- code: extension_organization_part
  version: 2026-04
  official_title: Application for Extension of Period of Stay — Organization/Sponsor
    Part (在留期間更新許可申請書 所属機関等作成用 P3-P4)
  citation:
    authority: Immigration Services Agency of Japan
    title: Application for Extension of Period of Stay
    url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
    source_version: 2026-04
  field_mappings:
  - form_field: sponsor.name
    answer_key: sponsor_name
    required: false
  - form_field: employment.status
    answer_key: employment_status
    required: true
  - form_field: employment.employer_name
    answer_key: employer_name
    required: false
  - form_field: employment.corporate_number
    answer_key: employer_corporate_number
    required: false
  - form_field: employment.category
    answer_key: employer_category
    required: false
  - form_field: employment.annual_salary_jpy
    answer_key: annual_salary_jpy
    required: true
fees:
- code: extension_counter
  amount: 6000
  currency: JPY
  channel: counter
  published: true
  effective_from: '2025-04-01'
  note: Fee for extension of period of stay at a Regional Immigration Bureau counter.
  citation:
    authority: Immigration Services Agency of Japan
    title: Application for Extension of Period of Stay
    url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
    retrieved: '2026-08-01'
- code: extension_online
  amount: 5500
  currency: JPY
  channel: online
  published: true
  effective_from: '2025-04-01'
  note: Fee for extension of period of stay via the ISA online application system.
  citation:
    authority: Immigration Services Agency of Japan
    title: Application for Extension of Period of Stay
    url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
    retrieved: '2026-08-01'
- code: extension_counter_tiered
  currency: JPY
  channel: counter
  published: false
  effective_from: '2026-10-01'
  note: Draft tiered schedule based on the period granted (cabinet order not final).
    Fee is charged on permission, not on application — a refusal incurs no fee.
  tiers:
  - period: 3m
    amount: 10000
    note: 3 months or less — draft, not confirmed
  - period: 1y
    amount: 33000
    note: 1 year — draft, not confirmed
  - period: 3y
    amount: 64000
    note: 3 to under 5 years — draft, not confirmed
  - period: 5y
    amount: 75000
    note: 5 years or more — draft, not confirmed
  citation:
    authority: Immigration Services Agency of Japan
    title: Draft ISA fee revision figures (published 24 June 2026, public comment)
    url: https://www.moj.go.jp/isa/applications/online/online-QA.html
    retrieved: '2026-08-01'
sources:
- title: Application for Extension of Period of Stay (MOJ)
  url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
  retrieved: '2026-08-01'
- title: 技術・人文知識・国際業務 clarification guidance (別紙4)
  url: https://www.moj.go.jp/isa/applications/procedures/16-3.html
