    type: boolean
    section: "Guarantor or inviter in Japan"
  studied_japanese_formally:
    prompt: "Have you studied Japanese at a school, or taken a Japanese language test?"
    type: boolean
    section: "Education & qualifications"
  nationality:
    prompt: "What is your nationality or region, exactly as printed in your passport?"
    type: string
    section: "Your details"
    min_length: 2
    max_length: 64
  date_of_birth:
    prompt: "What is your date of birth (YYYY-MM-DD)?"
    type: date
    section: "Your details"
  full_name:
    prompt: "What is your full name as shown in your passport (family name first)?"
