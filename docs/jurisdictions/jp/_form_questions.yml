# Intake questions for the boxes on Japan's official application forms.
#
# Ops-editable: change wording, sections, options or gating here without touching
# Python. Keys must match the answer keys the form layouts fill
# (apps/api/src/torii_api/services/jp_form_layouts.py) — a layout field with no
# question here fails test_every_form_field_has_an_intake_question.
#
# show_when gates a question behind another answer, so a block of the form is only
# asked about once it applies. The gate itself is asked automatically, immediately
# before the first question it controls.

questions:
  is_employed:
    prompt: "Are you employed, or do you have a job offer?"
    type: boolean
    section: "Work & employer"
  has_financial_support:
    prompt: "Is someone else paying for any part of your stay?"
    type: boolean
    section: "How your stay is paid for"
  has_guarantor_in_japan:
    prompt: "Do you have a guarantor or reference in Japan?"
    type: boolean
    section: "Guarantor or inviter in Japan"
  has_inviter:
    prompt: "Is someone in Japan inviting you?"
