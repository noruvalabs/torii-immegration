scope:
  jurisdiction: JP
  visa_category: work
  action: new_application
  is_live: true
  name: Japan Work Visa — New Application / COE Path (技術・人文知識・国際業務 認定申請)

stages:
  - sequence: 1
    code: sponsor_petition
    actor: sponsor
    handoff_artifact: coe
  - sequence: 2
    code: applicant_filing
    actor: applicant

intake:
  questions:
    # --- Section 1: Personal & Identity ---
    - key: full_name
      section: Personal & Identity
      prompt: What is your full name as it appears on your passport?
      type: string
      min_length: 2
      max_length: 200
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Application for Certificate of Eligibility (Work / Engineer)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: nationality
      section: Personal & Identity
      prompt: What is your nationality (passport country)?
      type: enum
      options:
        - BD
        - US
        - GB
        - CA
        - AU
        - DE
        - FR
        - SG
        - KR
        - IN
        - CN
        - PH
        - VN
        - ID
        - TH
        - MY
        - other
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Statutory Identification Requirements
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: date_of_birth
      section: Personal & Identity
      prompt: What is your date of birth (YYYY-MM-DD)?
      type: date
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Identity Verification Criteria
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: passport_number
      section: Personal & Identity
      prompt: What is your passport number?
      type: string
      min_length: 5
      max_length: 32
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Passport Details
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: current_residence_country
      section: Personal & Identity
      prompt: What is your country of current residence?
      type: string
      min_length: 2
      max_length: 100
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Current Residence Country Disclosure
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 2: Sponsoring Employer in Japan ---
    - key: employer_name
      section: Sponsoring Employer
      prompt: What is the registered name of your sponsoring employer in Japan?
      type: string
      min_length: 2
      max_length: 200
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Sponsoring Organization Details
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: corporate_number
      section: Sponsoring Employer
      prompt: What is the 13-digit Corporate Number (法人番号) of the employer?
      type: string
      min_length: 13
      max_length: 13
      required: true
      citation:
        authority: National Tax Agency of Japan (NTA)
        title: Corporate Number Verification
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: employer_category
      section: Sponsoring Employer
      prompt: What is the statutory category of the sponsoring employer (Category 1 to 4)?
      type: enum
      options:
        - category_1_listed_company
        - category_2_large_withholding
        - category_3_standard_sme
        - category_4_new_startup
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Employer Category Classifications
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: monthly_salary
      section: Sponsoring Employer
      prompt: What is your agreed gross monthly remuneration (in JPY)?
      type: integer
      min_value: 150000
      max_value: 5000000
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Remuneration Equal to or Greater than Japanese Nationals
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: job_description
      section: Sponsoring Employer
      prompt: What are your primary job duties in Japan?
      type: string
      min_length: 5
      max_length: 500
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Activity Scope (Engineer / Specialist in Humanities)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 3: Education & Experience ---
    - key: highest_degree_earned
      section: Education & Qualifications
      prompt: What is your highest level of completed education?
      type: enum
      options:
        - bachelor_degree
        - master_degree
        - doctorate_phd
        - vocational_college_japan
        - high_school_or_none
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Academic Degree Prerequisite (Bachelor's or Higher)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: field_of_study_major
      section: Education & Qualifications
      prompt: What was your academic major / degree subject?
      type: string
      min_length: 2
      max_length: 150
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Major-Job Relevance Criteria
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 4: Compliance & History ---
    - key: criminal_record
      section: Security & History
      prompt: Have you ever been convicted of a crime in any country?
      type: boolean
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Denial of Landing Criteria (Act Article 5)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

eligibility:
  rules:
    - key: highest_degree_earned
      operator: in
      value:
        - bachelor_degree
        - master_degree
        - doctorate_phd
        - vocational_college_japan
      failure_status: at_risk
      message: Academic degree (Bachelor or vocational college diploma in Japan) is required for Engineer / Specialist in Humanities status.
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Ministerial Ordinance on Criteria for Work Visa Status
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: monthly_salary
      operator: min
      value: 200000
      failure_status: at_risk
      message: Monthly remuneration must be equal to or greater than that of a Japanese national (typically ¥200,000/month minimum).
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Minimum Remuneration Standards
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

documents:
  requirements:
    - code: coe_application_form
      name: Official Application for Certificate of Eligibility (在留資格認定証明書交付申請書)
      is_required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Procedure 16-1 Format
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: employment_contract
      name: Employment Contract or Letter of Appointment (雇用契約書 / 労働条件通知書)
      is_required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Proof of Employment and Salary
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: university_degree_certificate
      name: University Graduation Certificate or Official Degree Transcript (卒業証明書)
      is_required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Academic Credentials Verification
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: company_statutory_table
      name: Sponsoring Company Statutory Category Proof (法定調書合計表 / 会社四季報)
      is_required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Employer Category Documentation
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

forms:
  - code: moj_coe_work
    version: "2026-04"
    official_title: Application for Certificate of Eligibility (在留資格認定証明書交付申請書)
    citation:
      authority: Immigration Services Agency of Japan (MOJ)
      title: Official Procedure 16-1
      url: https://www.moj.go.jp/isa/applications/procedures/16-1.html
    field_mappings:
      - form_field: applicant_name
        answer_key: full_name
        required: true
      - form_field: nationality
        answer_key: nationality
        required: true
      - form_field: passport_no
        answer_key: passport_number
        required: true
      - form_field: employer
        answer_key: employer_name
        required: true
      - form_field: salary
        answer_key: monthly_salary
        required: true
