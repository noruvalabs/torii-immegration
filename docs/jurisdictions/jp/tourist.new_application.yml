scope:
  jurisdiction: JP
  visa_category: tourist
  action: new_application
  is_live: true
  name: Japan Short-Stay Tourist & Family Visit Visa (短期滞在・観光・知人訪問)

stages:
  - sequence: 1
    code: applicant_filing
    actor: applicant

intake:
  questions:
    # --- Section 1: Personal & Identity ---
    - key: full_name
      section: Personal & Identity
      prompt: What is your full name as it appears on your passport?
      type: string
      min_length: 2
      max_length: 200
      required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA) / Immigration Services Agency (MOJ)
        title: Guide to Japanese Visas - Temporary Visitor (Tourism & Visits)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: nationality
      section: Personal & Identity
      prompt: What is your nationality (passport country)?
      type: enum
      options:
        - BD
        - US
        - GB
        - CA
        - AU
        - DE
        - FR
        - SG
        - KR
        - IN
        - CN
        - PH
        - VN
        - ID
        - TH
        - MY
        - other
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Visa Requirement Guidelines by Country
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: date_of_birth
      section: Personal & Identity
      prompt: What is your date of birth (YYYY-MM-DD)?
      type: date
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Official Visa Application Form Item 3
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: passport_number
      section: Personal & Identity
      prompt: What is your passport number?
      type: string
      min_length: 5
      max_length: 32
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Official Visa Application Form Item 5
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: passport_expiry_date
      section: Personal & Identity
      prompt: What is your passport expiry date (YYYY-MM-DD)?
      type: date
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Passport Validity Standards (Must be valid during entire stay)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 2: Travel & Itinerary ---
    - key: purpose_of_visit
      section: Travel & Itinerary
      prompt: What is the primary purpose of your trip to Japan?
      type: enum
      options:
        - tourism
        - visiting_family
        - visiting_friends
        - commercial_business
      required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Criteria for Issuance of Temporary Visitor Visa
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: planned_arrival_date
      section: Travel & Itinerary
      prompt: What is your planned date of arrival in Japan (YYYY-MM-DD)?
      type: date
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Schedule of Stay (滞在予定表) Requirements
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: intended_length_of_stay_days
      section: Travel & Itinerary
      prompt: How many days do you plan to stay in Japan (e.g. 15, 30, 90)?
      type: integer
      min_value: 1
      max_value: 90
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Maximum Permitted Period of Stay for Temporary Visitors
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: accommodation_name
      section: Travel & Itinerary
      prompt: What is the name of your planned hotel or host accommodation in Japan?
      type: string
      min_length: 2
      max_length: 200
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Accommodation Verification Notice
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: accommodation_address
      section: Travel & Itinerary
      prompt: What is the address and telephone number of your accommodation in Japan?
      type: string
      min_length: 5
      max_length: 300
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Daily Contact & Lodging Disclosures
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 3: Financial Solvency & Funding ---
    - key: trip_payer
      section: Financial Solvency & Funding
      prompt: Who is paying for your travel and living expenses in Japan?
      type: enum
      options:
        - self_funded
        - guarantor_in_japan
        - employer_sponsor
        - both
      required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Proof of Sufficient Funds / Letter of Guarantee (身元保証書)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: estimated_savings_available
      section: Financial Solvency & Funding
      prompt: What is your estimated available liquid balance for this trip (in USD or BDT equivalent)?
      type: string
      min_length: 1
      max_length: 50
      required: true
      citation:
        authority: Embassy of Japan Consular Section
        title: Bank Balance Certificate Requirements
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: occupation
      section: Financial Solvency & Funding
      prompt: What is your current profession or employment status in your home country?
      type: string
      min_length: 2
      max_length: 100
      required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Proof of Social & Economic Status in Home Country
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    # --- Section 4: Security & Disclosures ---
    - key: criminal_record
      section: Security & Disclosures
      prompt: Have you ever been convicted of any crime in any country?
      type: boolean
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Immigration Control Act Article 5 (Denial of Landing Criteria)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: prior_deportation
      section: Security & Disclosures
      prompt: Have you ever been deported or refused entry to Japan or any other country?
      type: boolean
      required: true
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Entry Prohibition Periods (Act Article 5 Item 9)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

eligibility:
  rules:
    - key: intended_length_of_stay_days
      operator: max
      value: 90
      failure_status: at_risk
      message: Temporary visitor status cannot exceed 90 days for a single entry.
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Maximum Temporary Visitor Duration
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: criminal_record
      operator: equals
      value: false
      failure_status: fail
      message: Prior criminal convictions may result in denial of landing under Immigration Control Act Article 5.
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Denial of Landing Criteria (Article 5)
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - key: prior_deportation
      operator: equals
      value: false
      failure_status: fail
      message: Past deportation orders require statutory landing permission review under Article 5.
      citation:
        authority: Immigration Services Agency of Japan (MOJ)
        title: Entry Ban & Deportation History Verification
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

documents:
  requirements:
    - code: passport_original
      name: Original Valid Passport (with at least 2 blank visa pages)
      is_required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Standard Visa Submission Dossier
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: visa_application_form
      name: Official Japan Visa Application Form with 45x35mm Photo
      is_required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Visa Application Form Format
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: schedule_of_stay
      name: Day-by-Day Schedule of Stay (滞在予定表)
      is_required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Schedule of Stay Official Template
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: bank_solvency_certificate
      name: Bank Solvency Certificate & Last 6 Months Bank Statement
      is_required: true
      citation:
        authority: Embassy of Japan Consular Section
        title: Proof of Sufficient Funds for Travel
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: employment_certificate
      name: Certificate of Employment / Leave Approval Letter
      is_required: true
      citation:
        authority: Embassy of Japan Consular Section
        title: Proof of Employment and Social Ties
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

    - code: flight_hotel_reservations
      name: Flight Itinerary & Hotel Booking Confirmations
      is_required: true
      citation:
        authority: Ministry of Foreign Affairs (MOFA)
        title: Travel Proof Document Requirements
        url: https://www.moj.go.jp/isa/applications/procedures/16-1.html

forms:
  - code: japan_visa_app_form
    version: "2026-04"
    official_title: Visa Application Form to Enter Japan (日本国査証申請書)
    citation:
      authority: Ministry of Foreign Affairs (MOFA)
      title: Official Visa Application Form Format
      url: https://www.moj.go.jp/isa/applications/procedures/16-1.html
    field_mappings:
      - form_field: applicant_name
        answer_key: full_name
        required: true
      - form_field: nationality
        answer_key: nationality
        required: true
      - form_field: date_of_birth
        answer_key: date_of_birth
        required: true
      - form_field: passport_no
        answer_key: passport_number
        required: true
      - form_field: purpose_of_visit
        answer_key: purpose_of_visit
        required: true
      - form_field: stay_days
        answer_key: intended_length_of_stay_days
        required: true
