scope:
  jurisdiction: US
  visa_category: student
  action: new_application
  is_live: true
  name: United States F-1/M-1 student — new application (I-20 → SEVIS → DS-160 → interview)
stages:
- sequence: 1
  code: sponsor_petition
  actor: sponsor
  handoff_artifact: i20
- sequence: 2
  code: applicant_filing
  actor: applicant
intake:
  questions:
  - key: visa_category_subtype
    section: 1. SEVIS & Academic Program
    prompt: What is your student / exchange visa category?
    type: enum
    options:
    - F1_Academic_Student
    - M1_Vocational_Student
    - J1_Exchange_Visitor
    required: true
    citation:
      authority: U.S. Department of State
      title: Student Visa Categories
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: has_i20
    section: 1. SEVIS & Academic Program
    prompt: Have you received your official signed Form I-20 (or Form DS-2019 for
      J-1) from your U.S. institution?
    type: boolean
    required: true
    citation:
      authority: U.S. Immigration and Customs Enforcement
      title: Student and Exchange Visitor Program (SEVP)
      url: https://www.ice.gov/sevis
  - key: sevis_id
    section: 1. SEVIS & Academic Program
    prompt: What is your SEVIS ID Number (printed at the top of Form I-20, starting
      with 'N' followed by 10 digits)?
    type: string
    min_length: 10
    max_length: 11
    required: true
    show_when:
      key: has_i20
      equals: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: school_sevis_code
    section: 1. SEVIS & Academic Program
    prompt: What is the School SEVIS Code (e.g. NYC214F00123000)?
    type: string
    min_length: 5
    max_length: 32
    required: true
    show_when:
      key: has_i20
      equals: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: school_name
    section: 1. SEVIS & Academic Program
    prompt: What is the legal name of your U.S. school or university (as printed on
      Form I-20)?
    type: string
    min_length: 2
    max_length: 200
    required: true
    show_when:
      key: has_i20
      equals: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: course_of_study_major
    section: 1. SEVIS & Academic Program
    prompt: What is your major or primary course of study (and CIP code if listed)?
    type: string
    min_length: 2
    max_length: 150
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: study_level
    section: 1. SEVIS & Academic Program
    prompt: What is your level of study?
    type: enum
    options:
    - Bachelor_Degree
    - Master_Degree
    - Doctorate_PhD
    - Associate_Degree
    - Language_Training
    - High_School
    - Non_Degree_Certificate
    - other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: program_start_date
    section: 1. SEVIS & Academic Program
    prompt: What is your program start date as printed on the I-20 (YYYY-MM-DD)?
    type: date
    required: true
    show_when:
      key: has_i20
      equals: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: program_end_date
    section: 1. SEVIS & Academic Program
    prompt: What is your expected program completion date (YYYY-MM-DD)?
    type: date
    required: true
    show_when:
      key: has_i20
      equals: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: school_address
    section: 1. SEVIS & Academic Program
    prompt: What is the official street address and state of your school / campus?
    type: string
    min_length: 5
    max_length: 250
    required: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: school_zip_code
    section: 1. SEVIS & Academic Program
    prompt: What is the postal ZIP code of your school?
    type: string
    min_length: 4
    max_length: 12
    required: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: dso_name
    section: 1. SEVIS & Academic Program
    prompt: What is the Designated School Official (DSO) or Responsible Officer name
      on your I-20?
    type: string
    min_length: 2
    max_length: 150
    required: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: dso_email
    section: 1. SEVIS & Academic Program
    prompt: What is the DSO's email address?
    type: string
    min_length: 5
    max_length: 100
    required: false
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: dso_phone
    section: 1. SEVIS & Academic Program
    prompt: What is the DSO or International Student Office telephone number?
    type: string
    min_length: 5
    max_length: 32
    required: false
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: has_sevis_fee_receipt
    section: 1. SEVIS & Academic Program
    prompt: Have you paid the mandatory SEVIS I-901 fee ($350 for F-1) at FMJfee.com
      and received the receipt?
    type: boolean
    required: true
    citation:
      authority: U.S. Immigration and Customs Enforcement
      title: SEVIS I-901 Fee Payment
      url: https://www.fmjfee.com/i901fee/index.html
  - key: sevis_fee_receipt_number
    section: 1. SEVIS & Academic Program
    prompt: What is your SEVIS I-901 Fee payment confirmation / receipt number?
    type: string
    min_length: 5
    max_length: 32
    required: false
    show_when:
      key: has_sevis_fee_receipt
      equals: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: educational_institutions_attended
    section: 2. Academic Background & Tests
    prompt: List previous secondary and higher education institutions attended (school
      name, address, degree earned, start/end dates).
    type: string
    min_length: 5
    max_length: 800
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: standardized_tests_taken
    section: 2. Academic Background & Tests
    prompt: List standardized tests taken and scores (e.g. TOEFL 102, IELTS 7.5, Duolingo
      130, GRE, GMAT, SAT).
    type: string
    min_length: 2
    max_length: 200
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: gpa_final_grades
    section: 2. Academic Background & Tests
    prompt: What was your GPA or final grade average in your most recent degree/high
      school program?
    type: string
    min_length: 1
    max_length: 50
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: academic_continuity_notes
    section: 2. Academic Background & Tests
    prompt: Briefly explain how this U.S. study program logically builds on your past
      academic background or career step.
    type: string
    min_length: 5
    max_length: 500
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: i20_year1_total_cost_usd
    section: 3. Financial Funding & Sponsorship
    prompt: What is the total estimated cost of attendance for Year 1 as printed on
      Form I-20 (Tuition + Living Expenses in USD)?
    type: integer
    min_value: 1000
    max_value: 200000
    required: true
    citation:
      authority: U.S. Department of State & SEVP
      title: Form DS-160 & SEVIS I-20 Student Verification Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
  - key: funding_source
    section: 3. Financial Funding & Sponsorship
    prompt: What is your primary funding source?
    type: enum
    options:
    - Self_Funded
    - Family_Individual_Sponsor
    - University_Scholarship_Assistantship
    - Educational_Bank_Loan
    - Corporate_Government_Sponsorship
    - other
    required: true
    citation:
