  - key: post_graduation_career_plan
    section: 7. Nonimmigrant Intent & Career Plan
    prompt: What is your concrete career plan in Japan or your home country after
      completing your U.S. degree?
    type: string
    min_length: 10
    max_length: 600
    required: true
    citation:
      authority: U.S. Department of State
      title: INA Section 214(b) Student Intent
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/visa-denials.html
  - key: home_country_ties_summary
