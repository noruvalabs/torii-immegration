    min_value: 0
    max_value: 1000000000
    required: true
    citation:
      authority: U.S. Citizenship and Immigration Services (USCIS)
      title: INA Section 101(a)(15)(H) & Form I-129 Petition Regulations
      url: https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-1b-specialty-occupations
  - key: applicant_liquid_funds_jpy
    section: 3. Financial Funding & Sponsorship
    prompt: What is the total liquid funds currently available in bank accounts (in
