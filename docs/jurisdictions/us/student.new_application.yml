    prompt: Describe your social, family, and economic anchors in Japan / home country
      ensuring your departure upon graduation.
    type: string
    min_length: 5
    max_length: 600
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: interview_aware
    section: 8. Interview & Security Screening
    prompt: An in-person interview is mandatory for F-1 applicants (no interview waiver
      / dropbox for F/M/J) since September 2025. Are you prepared to attend an in-person
      interview?
