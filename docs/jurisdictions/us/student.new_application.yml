    type: integer
    min_value: 0
    max_value: 1000000000
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: scholarship_amount_usd
    section: 3. Financial Funding & Sponsorship
    prompt: What is the university scholarship, assistantship, or fellowship award
