      title: Immigration and Nationality Act (INA) Section 212(a) Inadmissibility
        Grounds
      url: https://travel.state.gov/content/travel/en/us-visas.html
  - key: prior_immigration_violations_deportations
    section: 8. Interview & Security Screening
    prompt: Have you ever been ordered removed, deported, or subject to exclusion
      proceedings in any country?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Immigration and Nationality Act (INA) Section 212(a) Inadmissibility
        Grounds
      url: https://travel.state.gov/content/travel/en/us-visas.html
  - key: sanctioned_countries_travel
    section: 8. Interview & Security Screening
    prompt: Have you traveled to Cuba (on/after Jan 12 2021), Iran, Iraq, Syria, Sudan,
      Libya, Somalia, Yemen, or North Korea?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
eligibility:
  rules:
  - key: has_i20
    operator: equals
    value: true
    failure_status: fail
    message: An official, signed Form I-20 issued by an SEVP-certified U.S. institution
      is legally required before applying for an F-1 student visa.
    citation:
      authority: U.S. Department of Homeland Security
      title: SEVP — Form I-20 Certificate of Eligibility
      url: https://www.ice.gov/sevis
      source_version: 2026-04
  - key: has_sevis_fee_receipt
    operator: equals
    value: true
    failure_status: fail
    message: The mandatory SEVIS I-901 fee ($350 for F-1) must be paid at FMJfee.com
      prior to attending the consular visa interview.
    citation:
      authority: U.S. Immigration and Customs Enforcement
      title: SEVIS I-901 fee
      url: https://www.fmjfee.com/i901fee/index.html
      source_version: 2026-04
  - key: has_financial_support
    operator: equals
    value: true
    failure_status: fail
    message: Under INA 214(b), you must document immediate liquid funds covering the
      full 1-year estimated cost of attendance (tuition + living expenses) stated
      on Form I-20.
    citation:
      authority: U.S. Department of State
      title: F-1 Student Visa Financial Qualifications
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - key: applicant_liquid_funds_jpy
    operator: min
    value: 3000000
    failure_status: at_risk
    message: Available liquid bank funds appear low relative to standard U.S. university
      Year 1 tuition and living costs. Consular officers scrutinize unencumbered bank
      balances and sponsor income capacity.
    citation:
      authority: U.S. Department of State
      title: Student Visa Financial Requirements
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - key: interview_aware
    operator: equals
    value: true
    failure_status: review
    message: An in-person interview is mandatory for all F/M/J applicants. Schedule
      the appointment at the U.S. Embassy Tokyo or Consulate Naha/Osaka after submitting
      Form DS-160.
    citation:
      authority: U.S. Department of State
      title: In-person interview requirement for nonimmigrant visas
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/policy-updates.html
      source_version: 2026-04
  - key: prior_us_visa_refusal
    operator: equals
    value: false
    failure_status: review
    message: Prior U.S. visa refusal requires detailed disclosure on Form DS-160 and
      strong proof of academic intent and changed circumstances under INA 214(b).
    citation:
      authority: U.S. Department of State
      title: Visa Denials and Student Intent
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/visa-denials.html
      source_version: 2026-04
  - key: criminal_disclosures
    operator: equals
    value: false
    failure_status: review
    message: Certain criminal arrests or convictions may trigger inadmissibility under
      INA 212(a)(2); consular review and court records required.
    citation:
      authority: U.S. Citizenship and Immigration Services
      title: Inadmissibility Grounds (INA 212(a))
      url: https://www.uscis.gov/laws-and-regulations/immigration-and-nationality-act
      source_version: 2026-04
  - key: drug_abuse_addiction_history
    operator: equals
    value: false
    failure_status: fail
    message: Drug abuse or controlled substance violations trigger mandatory ineligibility
      under INA 212(a)(2)(A).
    citation:
      authority: U.S. Department of State
      title: Controlled Substances Ineligibility
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/waivers.html
      source_version: 2026-04
  - key: prior_immigration_violations_deportations
    operator: equals
    value: false
    failure_status: fail
    message: Prior deportation, unlawful presence, or visa fraud requires an INA 212(d)(3)
      waiver of inadmissibility.
    citation:
      authority: U.S. Citizenship and Immigration Services
      title: Unlawful Presence and Inadmissibility
      url: https://www.uscis.gov/laws-and-regulations/immigration-and-nationality-act
      source_version: 2026-04
  - key: sanctioned_countries_travel
    operator: equals
    value: false
    failure_status: warning
    message: Travel to sanctioned countries requires additional administrative security
      screening.
    citation:
      authority: U.S. Department of State
      title: Administrative Processing and Security Screenings
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/administrative-processing-information.html
      source_version: 2026-04
documents:
  items:
  - code: passport
    name:
      en: Valid Passport (valid at least 6 months beyond intended U.S. stay)
      ja: 有効なパスポート（米国滞在予定期間＋6ヶ月以上の残存期間）
    how_to_obtain:
      en: Original valid passport plus any previous passports containing prior U.S.
        visas.
    why_required:
      en: Primary identification and travel document required for visa issuance.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: F-1 Student Visa Checklist
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: ds160_confirmation
    name:
      en: DS-160 Confirmation Page with Barcode
      ja: DS-160確認ページ（バーコード付き）
    how_to_obtain:
      en: Submit Form DS-160 online at ceac.state.gov (with SEVIS ID and school details)
        and print barcode confirmation.
    why_required:
      en: Mandatory entry pass for the consular visa interview.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: DS-160 Online Nonimmigrant Visa Application
      url: https://ceac.state.gov/genniv/
      source_version: 2026-04
  - code: interview_letter
    name:
      en: Visa Interview Appointment Confirmation Letter
      ja: 面接予約確認書
    how_to_obtain:
      en: Schedule an appointment on the official U.S. visa portal for Japan and print
        the confirmation letter.
    why_required:
      en: Entry pass for the mandatory in-person interview at U.S. Embassy Tokyo /
        Consulates.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: In-person interview requirement for nonimmigrant visas
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/policy-updates.html
      source_version: 2026-04
  - code: mrv_fee_receipt
    name:
      en: MRV Application Fee Payment Receipt ($185)
      ja: ビザ申請料金（MRV Fee $185）領収書
    how_to_obtain:
      en: Pay the non-refundable MRV visa fee online or via bank transfer and print
        confirmation.
    why_required:
      en: Proof of mandatory visa application fee payment.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Fees for Visa Services
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/fees/fees-visa-services.html
      source_version: 2026-04
  - code: photo
    name:
      en: U.S. Visa Photo (2x2 inch / 5x5 cm color, white background)
      ja: 米国ビザ用写真（5cm×5cm、白背景）
    how_to_obtain:
      en: Compliant 2x2 inch color photo taken within 6 months meeting State Department
        guidelines.
    why_required:
      en: Required for visa foil issuance.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Photo Requirements
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/photos.html
      source_version: 2026-04
  - code: residence_card
    name:
      en: Japanese Residence Card (Zairyu Card) - for non-Japanese applicants
      ja: 在留カード（日本国籍以外の方）
    how_to_obtain:
      en: Original current Japanese Residence Card with valid status of residence.
    why_required:
      en: Proves legal residence status in Japan for third-country nationals applying
        in Japan.
    is_required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Residence Card System
      url: https://www.moj.go.jp/isa/applications/procedures/index.html
      source_version: 2026-04
  - code: i20
    name:
      en: Form I-20 (Certificate of Eligibility for Nonimmigrant Student Status)
      ja: I-20原本（学校DSOおよび申請者本人の署名入り）
    how_to_obtain:
      en: Issued by your SEVP-certified U.S. school; signed by both the school DSO
        and you (or parent if under 18).
    why_required:
      en: Primary legal document establishing SEVP acceptance, SEVIS ID, program duration,
        and estimated costs.
    is_required: true
    citation:
      authority: U.S. Department of Homeland Security
      title: SEVP — Students (F/M)
      url: https://www.ice.gov/sevis
      source_version: 2026-04
  - code: sevis_fee_receipt
    name:
      en: SEVIS I-901 Fee Payment Receipt ($350)
      ja: SEVIS I-901費用（$350）支払証明書
    how_to_obtain:
      en: Pay online at fmjfee.com using your SEVIS ID and school code, and print
        the official receipt.
    why_required:
      en: Mandatory proof of SEVIS fee payment required before visa interview.
    is_required: true
    citation:
      authority: U.S. Immigration and Customs Enforcement
      title: SEVIS I-901 fee
      url: https://www.fmjfee.com/i901fee/index.html
      source_version: 2026-04
  - code: admission_letter
    name:
      en: University / School Official Acceptance Letter
      ja: 米国大学・教育機関の正式合格通知書（Acceptance Letter）
    how_to_obtain:
      en: Provided by the U.S. university or school international admissions office.
    why_required:
      en: Confirms unconditional admission to the academic program.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: F-1 Student Visa Requirements
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: academic_transcripts
    name:
      en: Official Academic Transcripts (High School & Higher Education)
      ja: 成績証明書原本（高校および大学・大学院）
    how_to_obtain:
      en: Sealed official transcripts in English from all secondary schools and colleges
        attended.
    why_required:
      en: Proves academic qualification, grade point average, and continuous academic
        standing.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Student Visa Application Documents
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: degree_certificates
    name:
      en: Degree Certificates / Diplomas / Graduation Certificates
      ja: 卒業証明書・学位記
    how_to_obtain:
      en: Official graduation certificates or degree diplomas from prior educational
        institutions.
    why_required:
      en: Verifies completion of prerequisites required for the intended level of
        study.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Student Visa Application Documents
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: test_score_reports
    name:
      en: Standardized Test Score Reports (TOEFL, IELTS, Duolingo, GRE, GMAT, SAT)
      ja: 語学試験・適性試験スコア票（TOEFL, IELTS, Duolingo, GRE, GMAT等）
    how_to_obtain:
      en: Official score reports from ETS, British Council, Duolingo, College Board,
        etc.
    why_required:
      en: Demonstrates English language proficiency and academic aptitude matching
        program requirements.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Student Visa Language Proficiency
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: financial_evidence
    name:
      en: Bank Balance Certificate(s) & 6-Month Statements (Covering Year 1 I-20 Total
        Cost)
      ja: 残高証明書および過去6ヶ月分の預金取引明細書（初年度総費用をカバー）
    how_to_obtain:
      en: Bank balance certificate in English and 6 months of detailed account statements
        showing liquid funds.
    why_required:
      en: Demonstrates immediate liquid funds covering tuition and living expenses
        without unauthorized work.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: F-1 Student Visa Financial Qualifications
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
  - code: sponsor_affidavit
    name:
      en: Signed Sponsor Affidavit of Support & Proof of Sponsor Income (Tax Returns
        / Pay Slips)
      ja: 資金提供者の身元引受書（Affidavit of Support）および所得証明・納税証明書
    how_to_obtain:
      en: Signed affidavit of financial support from parent/sponsor, along with employment
        certificate, tax returns, and relationship proof.
    why_required:
      en: Demonstrates legitimate, continuous financial backing for subsequent years
        of study.
    is_required: false
    citation:
      authority: U.S. Citizenship and Immigration Services
      title: Form I-134 Declaration of Financial Support
      url: https://www.uscis.gov/i-134
      source_version: 2026-04
  - code: scholarship_letter
    name:
      en: Official University Scholarship / Assistantship / Loan Sanction Letter
      ja: 奨学金授与証明書または教育ローン承認書（該当者のみ）
    how_to_obtain:
      en: Letter from university department or approved bank detailing grant, stipend,
        or loan amount.
    why_required:
      en: Proves institutional funding or authorized educational credit.
    is_required: false
    citation:
      authority: U.S. Department of State
      title: Student Financial Sponsorship
      url: https://travel.state.gov/content/travel/en/us-visas/study/student-visa.html
      source_version: 2026-04
