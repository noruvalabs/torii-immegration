scope:
  jurisdiction: US
  visa_category: tourist
  action: new_application
  is_live: false
  name: United States B1/B2 tourist & business — new application (ESTA vs visa branch)
stages:
- sequence: 1
  code: applicant_filing
  actor: applicant
intake:
  questions:
  - key: full_name
    section: 1. Personal Information
    prompt: What is your full legal name as it appears on your passport (Surname,
      Given Names)?
    type: string
    min_length: 2
    max_length: 200
    required: true
    citation:
      authority: U.S. Department of State
      title: DS-160 Online Nonimmigrant Visa Application
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/forms/ds-160-online-nonimmigrant-visa-application.html
  - key: other_names_used
    section: 1. Personal Information
    prompt: Have you ever used other names (maiden name, alias, religious name, professional
      name)?
    type: string
    min_length: 2
    max_length: 200
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: gender
    section: 1. Personal Information
    prompt: What is your sex / gender?
    type: enum
    options:
    - Male
    - Female
    - Other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: marital_status
    section: 1. Personal Information
    prompt: What is your current marital status?
    type: enum
    options:
    - Single
    - Married
    - Common_Law_Marriage
    - Civil_Union_Domestic_Partnership
    - Divorced
    - Widowed
    - Legally_Separated
    - Other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: date_of_birth
    section: 1. Personal Information
    prompt: What is your date of birth (YYYY-MM-DD)?
    type: date
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: city_of_birth
    section: 1. Personal Information
    prompt: What is your city of birth?
    type: string
    min_length: 2
    max_length: 100
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: country_of_birth
    section: 1. Personal Information
    prompt: What is your country of birth?
    type: string
    min_length: 2
    max_length: 100
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: nationality
    section: 2. Nationality & Legal Status
    prompt: What is your primary nationality (passport country)?
    type: enum
    options:
    - JP
    - US
    - GB
    - CA
    - AU
    - KR
    - DE
    - FR
    - SG
    - AE
    - NZ
    - NL
    - IN
    - CN
    - BD
    - PH
    - VN
    - ID
    - TH
    - MY
    - SA
    - other
    required: true
    citation:
      authority: U.S. Customs and Border Protection
      title: Visa Waiver Program (VWP) — eligible countries
      url: https://www.cbp.gov/travel/international-visitors/visa-waiver-program
  - key: has_other_nationality
    section: 2. Nationality & Legal Status
    prompt: Do you hold or have you ever held any other nationality or citizenship?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: other_nationality_country
    section: 2. Nationality & Legal Status
    prompt: What is the other country of nationality and passport number (if applicable)?
    type: string
    min_length: 2
    max_length: 150
    required: false
    show_when:
      key: has_other_nationality
      equals: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: is_permanent_resident_other_country
    section: 2. Nationality & Legal Status
    prompt: Are you a permanent resident of a country other than your primary nationality?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: national_id_number
    section: 2. Nationality & Legal Status
    prompt: What is your National Identification Number (e.g. Japan My Number or Home
      Country ID)?
    type: string
    min_length: 2
    max_length: 64
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: us_ssn_or_taxid
    section: 2. Nationality & Legal Status
    prompt: What is your U.S. Social Security Number (SSN) or Taxpayer ID (ITIN),
      if ever issued?
    type: string
    min_length: 4
    max_length: 32
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: current_residence_country
    section: 2. Nationality & Legal Status
    prompt: Which country do you currently reside in?
    type: enum
    options:
    - Japan
    - United States
    - United Kingdom
    - Canada
    - Australia
    - Germany
    - France
    - Singapore
    - South Korea
    - United Arab Emirates
    - New Zealand
    - Netherlands
    - India
    - China
    - Bangladesh
    - Philippines
    - Vietnam
    - Indonesia
    - other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: residence_card_number
    section: 2. Nationality & Legal Status
    prompt: What is your Japanese Residence Card (Zairyu Card) Number (if residing
      in Japan as foreign national)?
    type: string
    min_length: 12
    max_length: 12
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: japan_residence_status
    section: 2. Nationality & Legal Status
    prompt: What is your current Japanese residence status (e.g. Engineer/Specialist,
      Student, Dependent, Permanent Resident)?
    type: string
    min_length: 2
    max_length: 100
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: japan_residence_expiry
    section: 2. Nationality & Legal Status
    prompt: What is the expiration date of your Japanese Residence Card / Status (YYYY-MM-DD)?
    type: date
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_type
    section: 3. Passport & Travel Documents
    prompt: What is your passport type?
    type: enum
    options:
    - Regular
    - Official
    - Diplomatic
    - Other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_number
    section: 3. Passport & Travel Documents
    prompt: What is your passport number?
    type: string
    min_length: 5
    max_length: 32
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_book_number
    section: 3. Passport & Travel Documents
    prompt: What is your passport book number (inventory barcode/number, if printed)?
    type: string
    min_length: 2
    max_length: 32
    required: false
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_issuing_country
    section: 3. Passport & Travel Documents
    prompt: Which country issued your passport?
    type: string
    min_length: 2
    max_length: 100
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_issuing_city
    section: 3. Passport & Travel Documents
    prompt: In which city was your passport issued?
    type: string
    min_length: 2
    max_length: 100
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_issue_date
    section: 3. Passport & Travel Documents
    prompt: What is your passport issue date (YYYY-MM-DD)?
    type: date
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_expiry
    section: 3. Passport & Travel Documents
    prompt: What is your passport expiration date (YYYY-MM-DD)?
    type: date
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: passport_is_epassport
    section: 3. Passport & Travel Documents
    prompt: Does your passport contain an embedded digital chip (e-passport)?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: has_lost_stolen_passport
    section: 3. Passport & Travel Documents
    prompt: Have you ever lost a passport or had one stolen?
    type: boolean
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: lost_passport_explanation
    section: 3. Passport & Travel Documents
    prompt: Please explain the circumstances and lost passport number (if known).
    type: string
    min_length: 5
    max_length: 500
    required: false
    show_when:
