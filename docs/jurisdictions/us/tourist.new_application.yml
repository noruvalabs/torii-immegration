    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: purpose_of_visit
    section: 4. U.S. Travel Plans
    prompt: What is the primary purpose of your trip to the United States?
    type: enum
    options:
    - tourism
    - business
    - visiting_family
    - medical
    - other
    required: true
    citation:
      authority: U.S. Department of State (Consular Affairs)
      title: Form DS-160 Online Nonimmigrant Visa Application Guidelines
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
  - key: has_specific_travel_plans
    section: 4. U.S. Travel Plans
    prompt: Have you made specific travel plans (flights / confirmed dates)?
