eligibility:
  rules:
  - key: nationality
    operator: nationality_in
    value:
    - JP
    - GB
    - CA
    - AU
    - KR
    - AE
    - NL
    - CH
    - IE
    - NZ
    - DE
    - FR
    - SG
    failure_status: review
    message: Citizens of Visa Waiver Program (VWP) countries generally use ESTA for
      tourism or business stays up to 90 days. A formal B1/B2 visa is required if
      staying longer than 90 days, if ESTA was previously denied, or if applying as
      a third-country resident.
    citation:
      authority: U.S. Customs and Border Protection
      title: Visa Waiver Program (VWP) — eligible countries
      url: https://www.cbp.gov/travel/international-visitors/visa-waiver-program
      source_version: 2026-04
  - key: passport_is_epassport
    operator: equals
    value: true
    failure_status: warning
    message: An electronic passport (e-Passport with digital chip) is mandatory for
      ESTA travel and strongly recommended for DS-160 consular appointments.
    citation:
      authority: U.S. Customs and Border Protection
      title: Visa Waiver Program requirements
      url: https://www.cbp.gov/travel/international-visitors/visa-waiver-program
      source_version: 2026-04
  - key: intended_length_of_stay_days
    operator: max
    value: 90
    failure_status: warning
    message: Stays over 90 days are ineligible for ESTA (VWP) and require a full B1/B2
      consular visa. For B1/B2, long open-ended stays (3-6 months) trigger high scrutiny
      under INA 214(b).
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa - Permissible Length of Stay
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - key: has_sufficient_funds
    operator: equals
    value: true
    failure_status: fail
    message: Under INA 214(b), you must demonstrate sufficient liquid funds to cover
      all travel, accommodation, and living expenses without unauthorized U.S. employment.
    citation:
      authority: U.S. Department of State
      title: INA Section 214(b) Presumption of Immigrant Intent
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/visa-denials.html
      source_version: 2026-04
  - key: liquid_funds_available_jpy
    operator: min
    value: 300000
    failure_status: at_risk
    message: Liquid funds in your bank account appear low for international travel
      and lodging. Consular officers assess whether available liquid funds comfortably
      support your itinerary.
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa Financial Qualifications
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - key: has_vwp_denial_history
    operator: equals
    value: false
    failure_status: fail
    message: Prior ESTA denial or U.S. overstay disqualifies you from VWP/ESTA. You
      must apply for a B1/B2 visa and disclose the prior immigration history.
    citation:
      authority: U.S. Customs and Border Protection
      title: ESTA eligibility and ineligibility
      url: https://esta.cbp.dhs.gov/
      source_version: 2026-04
  - key: prior_us_visa_refusal
    operator: equals
    value: false
    failure_status: review
    message: Prior U.S. visa refusal requires detailed disclosure on Form DS-160 and
      demonstration of materially changed circumstances since the last refusal under
      INA 214(b).
    citation:
      authority: U.S. Department of State
      title: Visa Denials and Material Changes in Circumstances
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/visa-denials.html
      source_version: 2026-04
  - key: has_us_visa_cancelled_revoked
    operator: equals
    value: false
    failure_status: fail
    message: Prior visa cancellation or revocation requires formal consular adjudication
      and explanation.
    citation:
      authority: U.S. Department of State
      title: Visa Ineligibilities and Revocations
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/waivers.html
      source_version: 2026-04
  - key: sanctioned_countries_travel
    operator: equals
    value: false
    failure_status: warning
    message: Travel to sanctioned countries (e.g. Cuba after Jan 2021, Iran, Syria,
      North Korea) renders you ineligible for ESTA, requiring a full B1/B2 consular
      visa application.
    citation:
      authority: U.S. Customs and Border Protection
      title: Terrorist Travel Prevention Act Restrictions
      url: https://www.cbp.gov/travel/international-visitors/visa-waiver-program
      source_version: 2026-04
  - key: has_criminal_record
    operator: equals
    value: false
    failure_status: fail
    message: A criminal record may trigger inadmissibility under INA Section 212(a)(2).
      Consular review and court/police records are required.
    citation:
      authority: U.S. Department of State
      title: Criminal Inadmissibility (INA 212(a)(2))
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/waivers.html
      source_version: 2026-04
  - key: communicable_disease_disorder
    operator: equals
    value: false
    failure_status: fail
    message: Certain communicable health conditions of public health significance
      require medical clearance (INA 212(a)(1)).
    citation:
      authority: U.S. Citizenship and Immigration Services
      title: Health-Related Inadmissibility
      url: https://www.uscis.gov/policy-manual/volume-8-part-b
      source_version: 2026-04
  - key: drug_abuse_addiction_history
    operator: equals
    value: false
    failure_status: fail
    message: History of drug abuse or controlled substance violations triggers mandatory
      review under INA 212(a)(2)(A).
    citation:
      authority: U.S. Department of State
      title: Controlled Substances Ineligibility
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/waivers.html
      source_version: 2026-04
  - key: prior_immigration_violations_deportations
    operator: equals
    value: false
    failure_status: fail
    message: Prior deportation, unlawful presence, or immigration misrepresentation
      requires an INA 212(d)(3) nonimmigrant waiver.
    citation:
      authority: U.S. Citizenship and Immigration Services
      title: Unlawful Presence and Inadmissibility
      url: https://www.uscis.gov/laws-and-regulations/immigration-and-nationality-act
      source_version: 2026-04
documents:
  items:
  - code: passport
    name:
      en: Valid Passport (plus previous passports with U.S. visas)
      ja: 有効なパスポート（過去の米国ビザ付き旧パスポート含む）
    how_to_obtain:
      en: Original passport valid for at least 6 months beyond intended stay in the
        United States.
    why_required:
      en: Confirms identity, nationality, and visa eligibility for the consular interview.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa Documents
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - code: ds160_confirmation
    name:
      en: DS-160 Confirmation Page with Barcode
      ja: DS-160確認ページ（バーコード付き）
    how_to_obtain:
      en: Complete Form DS-160 online at ceac.state.gov and print the confirmation
        page with barcode.
    why_required:
      en: Mandatory entry pass for the U.S. Embassy / Consulate interview.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: DS-160 Online Nonimmigrant Visa Application
      url: https://ceac.state.gov/genniv/
      source_version: 2026-04
  - code: appointment_letter
    name:
      en: Visa Interview Appointment Confirmation Letter
      ja: 面接予約確認書
    how_to_obtain:
      en: Schedule an appointment on the official U.S. visa portal for Japan (ustraveldocs)
        and print confirmation.
    why_required:
      en: Mandatory for security clearance and check-in at the U.S. Embassy Tokyo
        / Consulates.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: U.S. Visa Appointment Services
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/policy-updates.html
      source_version: 2026-04
  - code: mrv_fee_receipt
    name:
      en: MRV Application Fee Receipt ($185)
      ja: ビザ申請料金（MRV Fee $185）領収書
    how_to_obtain:
      en: Pay the non-refundable MRV application fee via credit card, Pay-easy, or
        bank transfer and print proof.
    why_required:
      en: Proof of mandatory consular application processing payment.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Fees for Visa Services
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/fees/fees-visa-services.html
      source_version: 2026-04
  - code: photo
    name:
      en: U.S. Visa Photo (2x2 inch / 5x5 cm color, white background)
      ja: 米国ビザ用写真（5cm×5cm、白背景）
    how_to_obtain:
      en: Obtain a compliant 2x2 inch (50x50 mm) color photograph taken within the
        last 6 months.
    why_required:
      en: Uploaded to DS-160 and brought to the interview if digital photo upload
        requires verification.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: Photo Requirements for U.S. Visas
      url: https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/photos.html
      source_version: 2026-04
  - code: residence_card
    name:
      en: Japanese Residence Card (Zairyu Card) - for non-Japanese nationals
      ja: 在留カード（日本国籍以外の方）
    how_to_obtain:
      en: Original current Japanese Residence Card (在留カード) with valid period of stay.
    why_required:
      en: Proves legal residence status and ties to Japan for third-country applicants
        applying in Japan.
    is_required: true
    citation:
      authority: Immigration Services Agency of Japan
      title: Residence Card System
      url: https://www.moj.go.jp/isa/applications/procedures/index.html
      source_version: 2026-04
  - code: employment_certificate
    name:
      en: Certificate of Employment (Zaishoku Shomeisho) & Approved Leave Letter
      ja: 在職証明書および休暇承諾書
    how_to_obtain:
      en: Request from your employer in Japan stating job title, salary, tenure, and
        approved vacation/travel dates.
    why_required:
      en: Proves ongoing employment ties and committed return date to Japan under
        INA 214(b).
    is_required: true
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa - Proving Strong Ties
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - code: business_registration
    name:
      en: Company Registration Certificate (Tokibo Tohon) & Corporate Tax Returns
        (Business Owners)
      ja: 登記簿謄本および法人税申告書（会社経営者・自営業の方）
    how_to_obtain:
      en: Obtain from the Japanese Legal Affairs Bureau (Houmukyoku) within 3 months.
    why_required:
      en: Demonstrates legitimate business ownership and strong financial/operational
        anchors in Japan.
    is_required: false
    citation:
      authority: Ministry of Justice Japan
      title: Certificate of Registered Matters
      url: https://www.moj.go.jp/
      source_version: 2026-04
  - code: enrollment_certificate
    name:
      en: Certificate of Enrollment (Zaigaku Shomeisho) & Academic Transcript (Students
        in Japan)
      ja: 在学証明書および成績証明書（日本の学校在籍者）
    how_to_obtain:
      en: Obtain from your Japanese school or university registrar.
    why_required:
      en: Proves active educational enrollment and obligation to return to Japan to
        complete studies.
    is_required: false
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa Qualifications
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - code: financial_evidence
    name:
      en: Bank Statements / Bank Passbook (Tsucho) covering last 3-6 months
      ja: 預金通帳（過去3〜6ヶ月分の記帳済コピー）または残高証明書
    how_to_obtain:
      en: Request bank balance certificate or copy of updated bank passbook showing
        steady salary deposits and funds.
    why_required:
      en: Demonstrates liquid financial capacity to fund travel without needing unauthorized
        U.S. work.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa Financial Evidence
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - code: tax_certificates
    name:
      en: Japanese Municipal Tax Certificates (Juminzei / Shotoku Shomeisho)
      ja: 課税証明書・納税証明書（市区町村役所発行）
    how_to_obtain:
      en: Obtain the latest 1-2 years tax certificate from your local Japanese city/ward
        municipal office.
    why_required:
      en: Official government verification of annual earnings and stable economic
        presence in Japan.
    is_required: false
    citation:
      authority: National Tax Agency Japan
      title: Tax Certificate Issuance
      url: https://www.nta.go.jp/
      source_version: 2026-04
  - code: travel_itinerary
    name:
      en: Day-by-Day Travel Itinerary & Hotel Confirmations
      ja: 滞在日程表（日別の訪問予定・宿泊先一覧）
    how_to_obtain:
      en: Prepare a chronological travel plan showing dates, cities, activities, and
        hotel contact details.
    why_required:
      en: Corroborates genuine nonimmigrant tourist/business intent and proportional
        duration of stay.
    is_required: true
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa - Travel Purpose
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
  - code: invitation_letter
    name:
      en: Invitation Letter (B1 Business Event / B2 Host Letter with proof of host
        U.S. legal status)
      ja: 招へい理由書・イベント招待状（商用・知人訪問時）
    how_to_obtain:
      en: Letter from U.S. company or host detailing trip purpose, duration, lodging,
        and host's U.S. legal status.
    why_required:
      en: Validates business meeting necessity (B1) or personal relationship and accommodation
        (B2).
    is_required: false
    citation:
      authority: U.S. Department of State
      title: B1/B2 Visitor Visa Guidance
      url: https://travel.state.gov/content/travel/en/us-visas/tourism-visit/visitor.html
      source_version: 2026-04
