notes: >
  Saudi visit visas are filed online, but not by everyone on the same portal.
  The standard tourist eVisa (visa.visitsaudi.com, Ministry of Tourism) is open
  only to the permitted-country list in the eVisa Terms — Bangladesh is not on
  it. Other nationalities reach an online eVisa through the MOFA KSA Visa
  platform (ksavisa.sa) when they hold a used US/UK/Schengen tourist or
  business visa, US/UK/EU permanent residence, or GCC residence, and seven
  pilot countries (including Bangladesh) can buy an electronic Package Visa.
  Everyone else files a consular visit visa in person — for Bangladesh, at the
  Tasheer Saudi Visa Service Centre in Dhaka — and Umrah from a non-eligible
  passport goes through a Ministry-licensed agent filing on Nusuk Masar. One
  tourist scope serves all of these routes; the route questions in intake
  decide which channel a case follows.
