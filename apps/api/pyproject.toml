[project]
name = "torii-api"
version = "0.1.0"
description = "Torii API — the immigration form-preparation system of record (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    # System of record: SQLAlchemy 2 async. Two drivers ship so one URL switches
    # engines with no code change — asyncpg for Postgres, aiosqlite for the
    # zero-setup local SQLite default (see torii_api.db.engine.to_async_url).
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    # Background scheduler + task queue (outbox poller, renewal reminders, the
    # government-change monitor). Redis-backed; the API itself runs without it.
    "arq>=0.26",
    "structlog>=24.4",
    # Scalar API-reference UI served at /docs.
    "scalar-fastapi>=1.8",
    "httpx>=0.28",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.0",
    "pypdf>=6.0.0",
    "pymupdf>=1.25",
    "openai>=1.60",
]

[project.optional-dependencies]
portal-bot = [
    "playwright>=1.49",
]

[project.scripts]
torii-createadmin = "torii_api.management.createadmin:main"
torii-seed = "torii_api.management.seed:main"
torii-scrape = "torii_api.management.scrape_gov:main"
torii-fetch-forms = "torii_api.management.fetch_forms:main"
torii-check-form-revisions = "torii_api.management.check_form_revisions:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torii_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sorting, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# HTML email templates have inherently long lines.
"src/torii_api/auth/email.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
