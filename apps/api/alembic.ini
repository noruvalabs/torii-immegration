# Alembic config for the Torii API schema. The database URL is supplied at runtime
# (torii_api.db.migrator / TORII_DATABASE_URL), not hard-coded here.
#
#   uv run alembic upgrade head          # uses TORII_DATABASE_URL (default: ./torii.db)
#   uv run alembic revision -m "msg" --autogenerate
#
# Programmatic upgrades (startup, tests) go through torii_api.db.migrator.
[alembic]
script_location = src/torii_api/db/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
