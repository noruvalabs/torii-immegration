# Torii edge — routes the public host port to the web app and the API.
#
#   /            → web (Next.js): applicant app + admin back office
#   /backend/*   → api (FastAPI): browser-facing API surface, prefix stripped
#   /assistant/* → ai  (FastAPI): assistant, OCR, citations, prefix stripped
#   /healthz     → nginx's own liveness (compose healthcheck)
#
# The api's own /health and Scalar /docs are reachable via /backend/health and /backend/docs.
# Keep any future internal-only API surface (service-to-service) OFF this edge.
#
# TUNING NOTE — this stack runs on a 1 GB / shared-core host. Everything below that is not
# pure routing exists to keep work OFF the Node and Python processes, because CPU and RAM are
# the scarce resources here, not bandwidth:
#   * gzip so the JS bundles cross the wire ~4x smaller (Next.js does not compress its own
#     responses when it sits behind a proxy),
#   * upstream keepalive so a page load does not open a fresh TCP connection per asset,
#   * a proxy cache for immutable build assets so repeat visitors never reach Node at all.

# Cache zone for Next.js build output. `/_next/static/*` is content-hashed and immutable, so
# a long TTL is safe: a new build produces new paths. 100 MB on disk, 10 MB of keys in RAM
# (~80k entries) — sized to stay well clear of the host's memory budget.
proxy_cache_path /var/cache/nginx/torii_static
    levels=1:2
    keys_zone=torii_static:10m
    max_size=100m
    inactive=7d
    use_temp_path=off;

# Separate zone for HTML and RSC payloads, which turn over on every deploy rather than being
# content-addressed. Kept small and purged by the deploy script.
#
# Caching HTML here is sound for two specific reasons, both worth re-checking if either
# changes: (1) the web app authenticates from localStorage with no Next.js middleware, so the
# server has no idea who is asking and returns a byte-identical shell to everyone — the
# per-user data arrives afterwards over /backend/, which is never cached; (2) Next.js already
# advertises these pages to shared caches with `Cache-Control: s-maxage` and a correct
# `Vary: rsc, next-router-state-tree, …`, which nginx honours, so a client-side navigation's
# RSC payload can never be served in place of a document request.
#
# If the app ever gains cookie/middleware-based auth or server-rendered per-user content,
# THIS ZONE MUST GO.
proxy_cache_path /var/cache/nginx/torii_html
    levels=1:2
    keys_zone=torii_html:4m
    max_size=32m
    inactive=1h
    use_temp_path=off;

upstream torii_web {
    server web:3000;
    # Hold connections open between requests. Without this every proxied request costs a
    # TCP handshake against Node, which on a shared-core host is pure wasted CPU.
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream torii_api {
    server api:8000;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream torii_ai {
    server ai:8001;
    keepalive 8;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Compress everything text-shaped. Level 5 is the knee of the curve: near-identical ratio to
# 9 at roughly a third of the CPU, which matters when the box has a 0.25 vCPU baseline.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/wasm
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/javascript
    text/plain
    text/xml;

# Cache open file descriptors and their metadata — saves a stat() per request.
open_file_cache max=1000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 80;
    # Explicit because the nginx image's 10-listen-on-ipv6-by-default entrypoint script
    # cannot patch this file — it is bind-mounted read-only. Without it `localhost` inside
    # the container resolves to ::1 and every connection is refused.
    listen [::]:80;
    server_name _;

    # Generous cap for document uploads (passports, contracts) once the vault lands.
    client_max_body_size 25m;

    # Buffer request bodies modestly; anything larger spills to disk rather than to RAM.
    client_body_buffer_size 16k;

    # Drop slow/idle clients quickly; on a small box every held connection is a held worker
    # slot. These are generous for a browser but stingy for a stalled socket.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Next.js immutable build output ---------------------------------------
    # Content-hashed filenames: safe to cache hard at the edge and in the browser. This is
    # the single biggest win on a small host — a returning visitor's asset requests are
    # served from nginx and never wake the Node process.
    location /_next/static/ {
        proxy_pass http://torii_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache torii_static;
        proxy_cache_valid 200 301 302 7d;
        proxy_cache_lock on;
        # Keep serving the old copy while revalidating or if Node is busy/down.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        # Overrides whatever Next.js sent; these paths change name on every build.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Next.js image optimiser output — keyed by the full query string (url, w, q).
    location /_next/image {
        proxy_pass http://torii_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache torii_static;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    # Static files served out of apps/web/public (favicons, fonts, images). Not hashed, so a
    # shorter TTL with revalidation rather than `immutable`.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://torii_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache torii_static;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Browser → API. Strip the /backend prefix before proxying (matches the web app's
    # dev rewrite in next.config.ts, so the same client code works in both environments).
    #
    # Never cached: every response here is per-user and authenticated.
    location /backend/ {
        proxy_pass http://torii_api/;
        proxy_http_version 1.1;
        # Empty Connection header is what actually engages upstream keepalive.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Browser → AI service. Same prefix-stripping contract as /backend (mirrors the web
    # app's dev rewrite in next.config.ts), so `/assistant/ai/chat/...` reaches the AI
    # service as `/ai/chat/...` in both environments.
    #
    # Buffering is off and the read timeout is generous because these responses are LLM
    # calls: a Groq completion can hold the connection well past nginx's 60s default, and
    # buffering would defeat token-by-token streaming.
    location /assistant/ {
        proxy_pass http://torii_ai/;
        proxy_http_version 1.1;
        proxy_buffering off;
        # Streaming responses must not be compressed — gzip would buffer the token stream.
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → the Next.js server.
    location / {
        proxy_pass http://torii_web;
        proxy_http_version 1.1;
        # This block must keep the Upgrade/Connection pair: it is the only route that
        # carries websockets, and keepalive's empty Connection header would break them.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache torii_html;
        # Deliberately NOT ignoring the upstream Cache-Control. Next.js uses it to say which
        # routes are prerendered (`s-maxage=…`) and which must never be stored
        # (`private, no-store` on a dynamic route) — it knows that per-route and we do not.
        # The cost of honouring it is that a prerendered page is cached until the deploy
        # script purges this zone, which is exactly when its content can have changed.
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Never serve a cached body to, or store one from, a request that carries credentials
        # or is a websocket handshake.
        proxy_cache_bypass $http_authorization $http_upgrade;
        proxy_no_cache    $http_authorization $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
