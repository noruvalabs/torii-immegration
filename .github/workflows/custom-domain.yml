name: Manage Custom Domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - list
          - describe

permissions:
  id-token: write
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/529415836006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@tori-507709.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run Domain Mapping
        run: |
          if [ "${{ inputs.action }}" = "create" ]; then
            echo "Creating or checking domain mapping for visa.noruvalabs.com..."
            gcloud beta run domain-mappings create --service torii-web --domain visa.noruvalabs.com --region us-central1 || \
            gcloud beta run domain-mappings describe --domain visa.noruvalabs.com --region us-central1
          elif [ "${{ inputs.action }}" = "describe" ]; then
            gcloud beta run domain-mappings describe --domain visa.noruvalabs.com --region us-central1
          elif [ "${{ inputs.action }}" = "list" ]; then
            gcloud beta run domain-mappings list --region us-central1
          fi
